name: Build & Release

on:
  push:
    branches: ["neoforge/1.21.4"]
    tags: ["v*"]
  pull_request:
    branches: ["neoforge/1.21.4"]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (all Stonecutter versions)
        run: ./gradlew chiseledBuildAndCollect -x test
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Collect JARs
        run: |
          mkdir -p artifacts
          find build/libs -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            -exec cp {} artifacts/ \;
          echo "Built artifacts:"
          ls -lh artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: do-a-barrel-roll-neoforge-1.21.4
          path: artifacts/*.jar
          retention-days: 30

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew chiseledBuildAndCollect -x test
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Collect JARs
        run: |
          mkdir -p artifacts
          find build/libs -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            -exec cp {} artifacts/ \;

      - name: Get mod version
        id: version
        run: |
          VERSION=$(grep "^mod.version" gradle.properties | cut -d= -f2)
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Read changelog
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            CHANGELOG=$(awk '/^## /{if(p)exit; p=1} p' CHANGELOG.md)
            echo "content<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "content=See commit history for changes." >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Do a Barrel Roll ${{ steps.version.outputs.mod_version }} — NeoForge 1.21.4"
          body: |
            ## Do a Barrel Roll ${{ steps.version.outputs.mod_version }} for NeoForge 1.21.4

            Native NeoForge port — **no Forgified Fabric API required**.

            ${{ steps.changelog.outputs.content }}

            ### Requirements
            - Minecraft 1.21.4
            - NeoForge 21.4.x
            - [YACL](https://modrinth.com/mod/yacl) (optional — for the config screen)

            ### Installation
            Drop the `.jar` into your `mods/` folder and launch.
          files: artifacts/*.jar
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
