name: Build & Release

on:
  push:
    branches: ["neoforge/**"]
    tags: ["v*"]
  pull_request:
    branches: ["neoforge/**"]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (all Stonecutter versions)
        run: ./gradlew chiseledBuildAndCollect -x test
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Collect JARs
        run: |
          mkdir -p artifacts
          find build/libs -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            -exec cp {} artifacts/ \;
          echo "Built artifacts:"
          ls -lh artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: do-a-barrel-roll-neoforge
          path: artifacts/*.jar
          retention-days: 30

  release:
    name: Release to GitHub
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew chiseledBuildAndCollect -x test
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Collect JARs
        run: |
          mkdir -p artifacts
          find build/libs -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            -exec cp {} artifacts/ \;

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "^mod.version" gradle.properties | cut -d= -f2)
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Do a Barrel Roll ${{ steps.version.outputs.mod_version }} — NeoForge"
          body: |
            ![Do a Barrel Roll icon](https://cdn.modrinth.com/data/cached_images/cdfab9e6656e9189305107e5d5a7bc4f601d34ac_0.webp)
            
            ## Information
            THIS IS AN UNOFFICIAL PORT TO NEOFORGE!!!! ALL CREDITS TO [Enjarai](https://modrinth.com/user/enjarai) This version doesn't have any dependencies.
            
            ## Overview
            Do a Barrel Roll is a lightweight, fully clientside mod that changes elytra flight to be more fun and semi-realistic. It achieves this by redesigning movement with a completely unlocked camera orientation in mind, allowing for full pitch, yaw and roll control in flight.
            
            Some subtle and less subtle modifiers are also applied to the camera, including but not limited to smoothing and banking.
            
            ## Controls
            The default controls are as follows, but can be modified:
            - Mouse x axis to roll
            - Mouse y axis to pitch
            - strafe keys (normally A and D) to yaw
            
            ## Configuration
            The mod can be configured in-game using [YACL](https://modrinth.com/mod/yacl). Once you install both of these, you can access the config screen by finding the mod in the mods list and pressing the config button.
            
            A wide range of options are available, including custom mouse behavior, elytra activation restrictions and changing values of modifiers like banking, sensitivity and more.
            
            ## Disclaimers
            This mod does not actually modify the flight physics themselves, so in most cases it shouldn't trigger anticheat. However, doing things like loop de loops looks to the server like rapid camera movement and may get you flagged. Use at your own risk.
            
            Versions prior to 2.8.3 may not be suitable for use on multiplayer servers due to lax server-side restrictions
            
            ## Credits
            Based on the [Cool Elytra Roll](https://github.com/Jorbon/cool_elytra) mod by [Jorbon](https://github.com/Jorbon), specifically it's "realistic mode".
            
            Originally ported to Forge by [MehVahdJukaar](https://github.com/MehVahdJukaar). Modern Forge port based on [Sinytra's multiloader template](https://github.com/Sinytra/MultiLoader-Template).
            
            Original Mod by [Enjarai](https://modrinth.com/user/enjarai)
            
            Mod icon by Mizeno.
          files: artifacts/*.jar
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
